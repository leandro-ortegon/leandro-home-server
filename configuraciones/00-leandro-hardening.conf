# /etc/ssh/sshd_config.d/00-leandro-hardening.conf
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
MaxAuthTries 4
LoginGraceTime 30
X11Forwarding no

# Acceso de emergencia: contraseña SOLO desde la red de casa
Match Address 192.168.1.0/24
    PasswordAuthentication yes
