# ============================================================
# LEANDRO HOME SERVER - Configuración Samba
# Ubicación en el servidor: /etc/samba/smb.conf
# Original respaldado en: /etc/samba/smb.conf.bak-original
# ============================================================
[global]
   workgroup = WORKGROUP
   server string = Leandro Home Server
   server role = standalone server

   # Seguridad
   server min protocol = SMB3
   map to guest = never
   restrict anonymous = 2
   hosts allow = 127.0.0.1 192.168.1.0/24 100.64.0.0/10
   hosts deny = 0.0.0.0/0

   # Solo SMB moderno (puerto 445), sin NetBIOS
   disable netbios = yes
   smb ports = 445

   # Sin impresoras
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # Registros
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000

[archivos]
   comment = Archivos personales
   path = /srv/servidor/archivos
   valid users = leandro
   read only = no
   create mask = 0644
   directory mask = 0755

[compartido]
   comment = Carpeta compartida
   path = /srv/servidor/compartido
   valid users = leandro
   read only = no
   create mask = 0664
   directory mask = 0775

[backups]
   comment = Copias de seguridad (solo lectura)
   path = /srv/servidor/backups
   valid users = leandro
   read only = yes
